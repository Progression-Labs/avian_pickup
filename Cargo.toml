[package]
name = "avian_pickup"
version = "0.6.0"
authors = ["Jan Hohenheim <jan@hohenheim.ch>"]
license = "MIT OR Apache-2.0"
edition = "2024"
exclude = ["/assets/", "/docs/", "/.github/"]
repository = "https://github.com/Progression-Labs/avian_pickup"
description = "A plugin for implementing picking up dynamic rigid bodies in Avian physics for the Bevy engine. Modeled after Half Life 2's gravity gun."
keywords = ["bevy", "physics", "avian", "pickup", "gravity"]
categories = ["game-development"]

[features]
# This library makes no sense without `avian3d`, whose precision is f32 on this lineage:
# the default picks its parry backend, and a consumer that sets avian's features itself
# takes `avian_pickup` with `default-features = false`.
default = ["avian3d/parry-f32"]
serialize = ["dep:serde", "bevy/serialize", "avian3d/serialize"]

[dependencies]
rand = "0.10"
serde = { version = "1.0.210", optional = true }
bevy_ecs = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_app = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_transform = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_math = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_shape = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["std", "rand"] }
bevy_platform = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_reflect = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_time = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_utils = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
bevy_log = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }

# Upstream URLs: a consumer redirects bevy and avian onto its fork branches with [patch], as
# the [patch] sections below do for this checkout's own build.
[dependencies.avian3d]
git = "https://github.com/avianphysics/avian"
branch = "main"
default-features = false
features = ["3d", "default-collider"]

[dev-dependencies]
# The tests' headless app. avian3d compiles only with bevy's curves and `Visibility`
# (bevy_camera) on, which its own manifest does not turn on.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["std", "bevy_log", "bevy_curve", "bevy_camera"] }

# The branches zero's manifest names (Progression-Labs/zero Cargo.toml): this checkout builds
# and tests against the bevy and avian the game runs.
[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_app = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_ecs = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_log = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_math = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_platform = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_reflect = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_shape = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_time = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_transform = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_utils = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }

[patch."https://github.com/avianphysics/avian"]
avian3d = { git = "https://github.com/Progression-Labs/avian", branch = "aurora" }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
